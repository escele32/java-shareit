services:
  gateway:
    build: gateway
    image: shareit-gateway
    container_name: shareit-gateway
    ports:
      - "8080:8080"
    depends_on:
      - server
    environment:
      - SHAREIT_SERVER_URL=http://server:9090


  server:
    build: server
    image: shareit-server
    container_name: shareit-server
    ports:
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/shareit
      - SPRING_DATASOURCE_USERNAME=shareitName
      - SPRING_DATASOURCE_PASSWORD=shareitPass

  db:
    image: postgres:16.1
    container_name: shareit
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: shareitName
      POSTGRES_PASSWORD: shareitPass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d shareit -U shareitName"]
      timeout: 5s
      interval: 5s
      retries: 10

volumes:
  pg_data: